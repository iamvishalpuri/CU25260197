<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login and Admission Forms</title><style>body{font-family:Arial;background:#f1f5f9;margin:0;padding:25px}.container{display:flex;gap:25px;max-width:900px;margin:auto;flex-wrap:wrap}.card{background:white;padding:22px;border-radius:10px;box-shadow:0 3px 12px #cbd5e1;flex:1;min-width:300px}h1{text-align:center;color:#174a8b}.card h2{color:#174a8b}label{display:block;margin-top:10px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;padding:8px;margin-top:4px;border:1px solid #9aaac1;border-radius:4px}button{margin-top:15px;padding:10px 18px;background:#174a8b;color:white;border:0;border-radius:4px}</style></head>
<body><h1>COER University Forms</h1><div class="container"><div class="card"><h2>Login Form</h2><form onsubmit="event.preventDefault();alert('Login submitted');"><label for="username">Username</label><input id="username" type="text" required><label for="password">Password</label><input id="password" type="password" required><button type="submit">Login</button></form></div><div class="card"><h2>College Admission Form</h2><form onsubmit="event.preventDefault();alert('Admission form submitted');"><label for="applicant">Full Name</label><input id="applicant" type="text" required><label for="admissionEmail">Email</label><input id="admissionEmail" type="email" required><label for="admissionCourse">Course</label><select id="admissionCourse"><option>BCA</option><option>BBA</option><option>B.Com</option></select><label for="message">Address</label><textarea id="message" rows="3"></textarea><button type="submit">Apply for Admission</button></form></div></div></body>
</html>

<!-- Expected result: A page displays separate styled Login and College Admission forms with appropriate inputs and buttons. -->
