<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JavaScript Calculator</title><style>body{font-family:Arial;background:#eaf2ff;padding:35px}.calculator{background:white;max-width:360px;margin:auto;padding:25px;border-radius:12px;box-shadow:0 4px 14px #b7c5dd}h1{text-align:center;color:#174a8b;font-size:24px}input{width:100%;box-sizing:border-box;padding:10px;margin:7px 0;border:1px solid #9aaac1;border-radius:5px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}button{padding:11px;border:0;border-radius:5px;background:#174a8b;color:white;cursor:pointer}.result{margin-top:18px;font-weight:bold;text-align:center;color:#176b35}</style></head>
<body><div class="calculator"><h1>JavaScript Calculator</h1><input id="first" type="number" step="any" placeholder="First number"><input id="second" type="number" step="any" placeholder="Second number"><div class="buttons"><button onclick="calculate('+')">Addition (+)</button><button onclick="calculate('-')">Subtraction (-)</button><button onclick="calculate('*')">Multiplication (×)</button><button onclick="calculate('/')">Division (÷)</button></div><p class="result" id="result">Result: </p></div><script>function calculate(operator){const first=Number(document.getElementById('first').value);const second=Number(document.getElementById('second').value);if(document.getElementById('first').value===''||document.getElementById('second').value===''){show('Enter both numbers.');return;}if(operator==='/'&&second===0){show('Cannot divide by zero.');return;}let answer;if(operator==='+')answer=first+second;else if(operator==='-')answer=first-second;else if(operator==='*')answer=first*second;else answer=first/second;show('Result: '+answer);}function show(message){document.getElementById('result').textContent=message;}</script></body>
</html>

<!-- Expected result: The calculator performs addition, subtraction, multiplication, and division using JavaScript and handles empty input and division by zero. -->
