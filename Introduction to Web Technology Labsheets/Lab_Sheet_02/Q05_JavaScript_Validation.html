<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Validated Student Registration</title><style>body{font-family:Arial;background:#f2f7f2;padding:30px}.form-box{background:white;max-width:560px;margin:auto;padding:25px;border-radius:10px;box-shadow:0 4px 15px #c6d8c6}h1{text-align:center;color:#176b35}label{display:block;font-weight:bold;margin-top:11px}input{width:100%;box-sizing:border-box;padding:9px;margin-top:4px;border:1px solid #9aac9a;border-radius:5px}.error{color:#b42318;font-size:13px;min-height:16px}.success{color:#176b35;font-weight:bold;margin-top:16px}button{padding:10px 20px;background:#176b35;color:white;border:0;border-radius:5px;margin-top:10px}</style></head>
<body><div class="form-box"><h1>Student Registration</h1><form id="registrationForm" novalidate><label for="name">Name</label><input id="name" type="text"><div id="nameError" class="error"></div><label for="email">Email</label><input id="email" type="email"><div id="emailError" class="error"></div><label for="mobile">Mobile Number</label><input id="mobile" type="text" maxlength="10"><div id="mobileError" class="error"></div><label for="password">Password</label><input id="password" type="password"><div id="passwordError" class="error"></div><label for="age">Age</label><input id="age" type="number"><div id="ageError" class="error"></div><button type="submit">Submit</button><button type="reset">Reset</button><div id="success" class="success"></div></form></div><script>const form=document.getElementById('registrationForm');form.addEventListener('submit',function(event){event.preventDefault();document.querySelectorAll('.error').forEach(e=>e.textContent='');document.getElementById('success').textContent='';let valid=true;const name=document.getElementById('name').value.trim();const email=document.getElementById('email').value.trim();const mobile=document.getElementById('mobile').value.trim();const password=document.getElementById('password').value;const age=Number(document.getElementById('age').value);if(name.length<3){document.getElementById('nameError').textContent='Name must contain at least 3 characters.';valid=false;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){document.getElementById('emailError').textContent='Enter a valid email address.';valid=false;}if(!/^\d{10}$/.test(mobile)){document.getElementById('mobileError').textContent='Mobile number must contain exactly 10 digits.';valid=false;}if(password.length<6){document.getElementById('passwordError').textContent='Password must contain at least 6 characters.';valid=false;}if(!Number.isInteger(age)||age<17||age>60){document.getElementById('ageError').textContent='Age must be between 17 and 60.';valid=false;}if(valid)document.getElementById('success').textContent='Registration submitted successfully!';});form.addEventListener('reset',()=>{setTimeout(()=>{document.querySelectorAll('.error').forEach(e=>e.textContent='');document.getElementById('success').textContent='';},0);});</script></body>
</html>

<!-- Expected result: JavaScript validates Name, Email, Mobile Number, Password, and Age before displaying a success message. -->
