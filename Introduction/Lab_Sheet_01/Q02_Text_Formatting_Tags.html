<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>HTML Text Formatting Tags</title></head>
<body>
  <h1>Heading 1</h1><h2>Heading 2</h2><h3>Heading 3</h3><h4>Heading 4</h4><h5>Heading 5</h5><h6>Heading 6</h6>
  <p><b>Bold text</b></p>
  <p><strong>Strong importance text</strong></p>
  <p><i>Italic text</i></p>
  <p><em>Emphasized text</em></p>
  <p><u>Underlined text</u></p>
  <p><mark>Highlighted text</mark></p>
  <p><sup>Superscript text</sup></p>
  <p><sub>Subscript text</sub></p>
</body>
</html>

<!-- Expected result: The page demonstrates h1-h6, b, strong, i, em, u, mark, sup, and sub tags. -->
