<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Programming Languages</title></head>
<body>
  <h1>Programming Languages</h1>
  <ul style="list-style-type: disc;"><li>Java</li><li>Python</li><li>C++</li><li>JavaScript</li><li>HTML</li></ul>
  <h2>Circle Style</h2>
  <ul style="list-style-type: circle;"><li>Java</li><li>Python</li><li>C++</li><li>JavaScript</li><li>HTML</li></ul>
  <h2>Square Style</h2>
  <ul style="list-style-type: square;"><li>Java</li><li>Python</li><li>C++</li><li>JavaScript</li><li>HTML</li></ul>
</body>
</html>

<!-- Expected result: Five programming languages are displayed using unordered lists with different marker styles. -->
